    <style>
:root { --bg:#060b09; --surface:#0b1712; --surface-2:#102119; --text:#f1f7f4; --muted:#a7bbb2; --line:rgba(110,231,183,.17); --emerald:#10b981; --emerald-deep:#047857; --mint:#6ee7b7; --green:var(--emerald); --glow:rgba(16,185,129,.18); }
* { box-sizing:border-box; }
html { scroll-behavior:smooth; }
body { margin:0; background:var(--bg); color:var(--text); font-family:Arial, Helvetica, sans-serif; font-size:16px; }
body::before { content:""; position:fixed; inset:0; pointer-events:none; opacity:.4; background:linear-gradient(rgba(255,255,255,.018) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.018) 1px,transparent 1px); background-size:64px 64px; mask-image:linear-gradient(to bottom,black,transparent 80%); }
a { color:inherit; text-decoration:none; }
button { font:inherit; }
.shell,.site-header { width:min(1420px,calc(100% - 96px)); margin-inline:auto; }
.site-header { height:100px; display:grid; grid-template-columns:1fr auto 1fr; align-items:center; border-bottom:1px solid var(--line); position:relative; z-index:10; }
.identity { display:flex; align-items:center; gap:24px; width:max-content; }
.monogram { font-family:Georgia,serif; font-size:38px; line-height:1; letter-spacing:-.08em; padding-right:24px; border-right:2px solid var(--green); }
.identity-name { font-size:19px; font-weight:600; }
nav { display:flex; gap:44px; }
nav a { color:var(--muted); font-size:16px; font-weight:500; transition:.2s ease; }
nav a:hover { color:var(--text); }
.languages { justify-self:end; display:flex; gap:14px; }
.languages button { position:relative; width:38px; height:38px; display:grid; place-items:center; border:0; padding:0; background:none; color:#91a3a1; cursor:pointer; line-height:1; filter:saturate(.72); opacity:.68; transition:.2s ease; }
.languages img { width:28px; height:21px; display:block; object-fit:cover; border-radius:2px; box-shadow:0 0 0 1px rgba(255,255,255,.14); }
.languages button:hover { filter:saturate(1); opacity:1; transform:translateY(-1px); }
.languages button.active { color:var(--text); filter:saturate(1); opacity:1; }
.languages button.active::after { content:""; position:absolute; height:2px; inset:auto 0 2px; background:var(--emerald); }
.hero { min-height:650px; display:grid; grid-template-columns:1.08fr .92fr; align-items:center; border-bottom:1px solid var(--line); }
.eyebrow { color:var(--green)!important; font-family:"Courier New",monospace; font-weight:700; font-size:15px!important; letter-spacing:.17em; margin:0 0 26px!important; }
h1 { font-size:clamp(58px,5.6vw,88px); line-height:.98; letter-spacing:-.055em; margin:0; max-width:800px; }
h1 em { display:block; color:var(--text); font-style:normal; }
.intro { color:var(--muted); max-width:650px; font-size:19px; line-height:1.65; margin:28px 0 0; }
.actions { display:flex; gap:14px; margin-top:34px; }
.button { min-height:62px; display:inline-flex; align-items:center; justify-content:space-between; gap:34px; border:1px solid var(--line); padding:0 28px; font-weight:700; transition:.2s ease; }
.button span { font-size:22px; transition:transform .2s ease; }
.button:hover { transform:translateY(-2px); }
.button:hover span { transform:translateX(4px); }
.button.primary { color:#03110d; background:linear-gradient(110deg,var(--emerald-deep),var(--mint)); border-color:transparent; box-shadow:0 12px 50px rgba(16,185,129,.2); }
.button.secondary:hover { border-color:var(--green); }
.quality-orbit { width:520px; height:520px; position:relative; justify-self:end; border-radius:50%; background:radial-gradient(circle,var(--glow),transparent 56%); }
.orbit,.core,.node,.route { position:absolute; }
.orbit { border:1px solid rgba(16,185,129,.34); border-radius:50%; inset:50%; transform:translate(-50%,-50%); }
.orbit-one { width:420px;height:420px; }
.orbit-two { width:300px;height:300px;border-style:dashed; }
.orbit-three { width:180px;height:180px; }
.core { width:104px;height:104px;left:50%;top:50%;transform:translate(-50%,-50%);display:grid;place-items:center;border-radius:50%;font-weight:800;letter-spacing:.12em;background:radial-gradient(circle at 35% 30%,var(--mint),var(--emerald) 62%,var(--emerald-deep));box-shadow:0 0 60px rgba(16,185,129,.34); }
.node { display:grid;place-items:center;width:58px;height:58px;border:1px solid rgba(16,185,129,.48);background:#07110d;color:var(--mint);font:14px "Courier New",monospace; }
.node-one{left:20px;top:150px}.node-two{right:16px;top:105px}.node-three{right:30px;bottom:70px}.node-four{left:56px;bottom:45px}
.node-five{width:82px;left:50%;top:4px;transform:translateX(-50%)}.node-six{right:-8px;top:238px}.node-seven{left:-4px;bottom:132px}
.route { border-color:rgba(16,185,129,.48); border-style:solid; width:170px;height:100px; }
.route-one{left:75px;top:70px;border-width:1px 1px 0 0}.route-two{right:70px;bottom:50px;border-width:0 0 1px 1px}
.proof { min-height:138px; display:grid; grid-template-columns:repeat(4,1fr); border-bottom:1px solid var(--line); }
.fact { display:flex; gap:20px; align-items:center; padding:28px 24px; border-right:1px solid var(--line); }
.fact:last-child { border-right:0; }
.fact-icon { width:56px;height:56px;flex:0 0 56px;border:1px solid rgba(16,185,129,.58);border-radius:50%;display:grid;place-items:center;color:var(--mint);font:15px "Courier New",monospace; }
.fact strong,.fact small { display:block; }
.fact strong { font-size:19px; }
.fact small { color:var(--muted); margin-top:7px; font-size:15px; line-height:1.35; }
.section { padding-block:130px; border-bottom:1px solid var(--line); }
.section-heading { max-width:780px; margin-bottom:68px; }
.section-heading h2,.contact h2 { font-size:clamp(42px,4.2vw,68px); line-height:1.02; letter-spacing:-.045em; margin:0; }
.section-heading>p:last-child { color:var(--muted);font-size:18px;line-height:1.7;margin:28px 0 0;max-width:700px; }
.expertise-grid { display:grid; grid-template-columns:repeat(2,1fr); border-top:1px solid var(--line); border-left:1px solid var(--line); }
.expertise-card { padding:42px; min-height:280px; border-right:1px solid var(--line);border-bottom:1px solid var(--line);background:linear-gradient(135deg,rgba(16,33,25,.78),rgba(6,11,9,.3)); }
.expertise-card>span,.project-number,.services-grid article>span { color:var(--green);font:14px "Courier New",monospace;letter-spacing:.16em; }
h3 { font-size:25px; margin:36px 0 16px; }
.expertise-card p,.project-card p,.services-grid p { color:var(--muted);font-size:17px;line-height:1.7;margin:0; }
.experience-list { display:grid;gap:18px; }
.experience-card { display:grid;grid-template-columns:.75fr 1.25fr;border:1px solid var(--line);background:var(--surface); }
.experience-card:not(:first-child) { background:linear-gradient(135deg,rgba(16,33,25,.68),rgba(6,11,9,.45)); }
.role-meta,.role-details { padding:50px; }
.role-meta { border-right:1px solid var(--line); }
.role-meta>span { color:var(--green);font:14px "Courier New",monospace;letter-spacing:.12em; }
.role-meta strong { display:block;font-size:26px;margin:34px 0 8px; }.role-meta p{font-size:20px;margin:0 0 34px}.role-meta small{color:var(--muted);font-size:15px;line-height:1.5}
.role-intro { font-size:22px;line-height:1.55;margin:0 0 28px; }
.role-details ul { padding:0;margin:0;list-style:none;display:grid;gap:15px; }
.role-details li { color:var(--muted);font-size:16px;padding-left:23px;line-height:1.6;position:relative; }.role-details li::before{content:"";position:absolute;left:0;top:.65em;width:7px;height:7px;background:var(--green)}
.projects-grid { display:grid;grid-template-columns:repeat(2,1fr);gap:18px; }
.project-card { min-height:340px;padding:42px;border:1px solid var(--line);background:radial-gradient(circle at 100% 0%,rgba(16,185,129,.12),transparent 42%),var(--surface);transition:.2s ease; }
.project-card:hover { transform:translateY(-4px);border-color:rgba(16,185,129,.5); }
.project-card h3 { font-size:28px;max-width:440px; }
.tags { display:flex;flex-wrap:wrap;gap:8px;margin-top:34px; }.tags span{border:1px solid var(--line);color:#c6d2d0;padding:9px 13px;font-size:14px;font-weight:500}
.freelance { position:relative; }
.services-grid { display:grid;grid-template-columns:repeat(4,1fr);border:1px solid var(--line); }
.services-grid article { padding:32px;min-height:285px;border-right:1px solid var(--line); }
.services-grid article:last-child{border-right:0}.services-grid h3{font-size:20px;margin-top:30px}
.deliverables { display:flex;align-items:center;gap:30px;padding:26px 30px;margin-top:18px;background:linear-gradient(90deg,rgba(4,120,87,.16),rgba(110,231,183,.08));border:1px solid var(--line); }
.deliverables strong{margin-right:auto;font-size:17px}.deliverables span{color:#c6d2d0;font-size:15px;line-height:1.4}
.contact { margin-top:90px;margin-bottom:90px;min-height:360px;padding:70px;display:flex;align-items:center;justify-content:space-between;gap:60px;background:radial-gradient(circle at 85% 20%,rgba(16,185,129,.18),transparent 38%),var(--surface-2);border:1px solid var(--line); }
.contact>div{max-width:800px}.contact p:not(.eyebrow){color:var(--muted);font-size:18px;line-height:1.6}
.contact-links{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;min-width:330px}.contact-links .button{grid-column:1/-1}.social-link{display:flex;justify-content:space-between;padding:14px 2px;color:var(--muted);border-bottom:1px solid var(--line);font-size:15px;font-weight:500}.social-link:hover{color:var(--green);border-color:var(--green)}
footer { min-height:100px;border-top:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;color:var(--muted);font-size:15px; }
footer a{color:var(--green)}.footer-links{display:flex;gap:22px}
@keyframes pulse { 50%{box-shadow:0 0 78px rgba(16,185,129,.34)} }
.core { animation:pulse 4s ease-in-out infinite; }
@media(max-width:1050px){.site-header{grid-template-columns:1fr auto}.site-header nav{display:none}.hero{grid-template-columns:1fr;min-height:auto;padding-block:90px}.quality-orbit{position:absolute;right:2%;opacity:.28}.hero-copy{position:relative;z-index:2}.proof{grid-template-columns:repeat(2,1fr)}.fact:nth-child(2){border-right:0}.services-grid{grid-template-columns:repeat(2,1fr)}.services-grid article:nth-child(2){border-right:0}.services-grid article:nth-child(-n+2){border-bottom:1px solid var(--line)}.deliverables{flex-wrap:wrap}.deliverables strong{width:100%}.contact{padding:50px}}
@media(max-width:700px){.shell,.site-header{width:min(100% - 36px,1420px)}.site-header{height:auto;min-height:98px;grid-template-columns:1fr}.identity-name{font-size:18px}.monogram{font-size:32px}.languages{justify-self:start;margin-left:78px;margin-top:-18px;padding-bottom:12px}.languages button{font-size:16px}.quality-orbit{display:none}h1{font-size:49px}.hero{padding-block:72px}.actions{flex-direction:column}.button{width:100%}.proof{grid-template-columns:1fr}.fact{border-right:0;border-bottom:1px solid var(--line)}.section{padding-block:90px}.expertise-grid,.projects-grid,.experience-card{grid-template-columns:1fr}.role-meta{border-right:0;border-bottom:1px solid var(--line)}.role-meta,.role-details,.expertise-card,.project-card{padding:30px}.services-grid{grid-template-columns:1fr}.services-grid article{border-right:0;border-bottom:1px solid var(--line)!important}.deliverables{display:grid;gap:14px}.contact{margin-block:45px;padding:36px;display:block}.contact-links{min-width:0;margin-top:28px}.contact .button{margin-top:0}footer{gap:16px;flex-wrap:wrap;padding-block:22px}.footer-links{width:100%;flex-wrap:wrap}}
@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}.core{animation:none}.button,.project-card{transition:none}}


/* Accessible editorial redesign */
:root{
  --bg:#101c1d;--surface:#172627;--surface-2:#1d3030;--surface-3:#243939;
  --text:#e5eeeb;--muted:#b3c2be;--line:rgba(196,220,211,.18);
  --emerald:#55b99a;--emerald-deep:#2f806d;--mint:#8bd2bc;
  --green:var(--emerald);--glow:rgba(85,185,154,.14);
}
html{scroll-padding-top:122px}
body{background:
  radial-gradient(circle at 8% 5%,rgba(45,113,103,.18),transparent 30rem),
  linear-gradient(145deg,#101c1d 0%,#142323 52%,#101c1d 100%);
  color:var(--text);line-height:1.5}
body::before{opacity:.2;background-size:72px 72px}
:focus-visible{outline:3px solid var(--mint);outline-offset:4px;border-radius:4px}
.skip-link{position:fixed;left:18px;top:-80px;z-index:100;padding:12px 18px;background:var(--text);color:#142323}
.skip-link:focus{top:18px}
.site-header{
  position:sticky;top:14px;z-index:50;height:74px;margin-top:14px;padding:0 18px;
  grid-template-columns:auto 1fr auto;border:1px solid var(--line);border-radius:18px;
  background:rgba(23,38,39,.88);box-shadow:0 18px 45px rgba(4,12,12,.22);
  backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px)
}
.identity{gap:14px}.monogram{font-size:27px;padding-right:14px}.identity-name{font-size:16px}
nav{justify-content:center;gap:8px}
nav a{padding:9px 13px;border:1px solid transparent;border-radius:999px;font-size:14px;color:var(--muted)}
nav a:hover,nav a.active{color:var(--text);background:var(--surface-3);border-color:var(--line)}
.languages{gap:7px}.languages button{width:32px;height:32px}.languages img{width:23px;height:17px}
.hero{min-height:610px}.hero-copy{padding-top:38px}
.eyebrow{color:var(--mint)!important;letter-spacing:.13em}
h1{font-size:clamp(54px,5.5vw,84px);max-width:860px}
h1 em{color:#cad9d5}
.intro{color:var(--muted);max-width:720px}
.button{border-radius:12px;border-color:var(--line);min-height:58px}
.button.primary{color:#10211d;background:linear-gradient(110deg,#5ebc9f,#91d3bd);box-shadow:0 12px 36px rgba(42,120,98,.18)}
.node{background:#152323;color:var(--mint);border-radius:12px}
.core{color:#10211d}
.about{display:grid;grid-template-columns:minmax(260px,390px) 1fr;gap:clamp(48px,7vw,110px);align-items:center}
.portrait-wrap{position:relative;max-width:390px}
.portrait-wrap::before{content:"";position:absolute;inset:-18px 22px 22px -18px;border:1px solid rgba(139,210,188,.32);border-radius:30px}
.portrait{position:relative;display:block;width:100%;aspect-ratio:1/1;object-fit:cover;border-radius:26px;filter:saturate(.88) contrast(.96);box-shadow:0 28px 70px rgba(3,12,12,.3)}
.portrait-note{position:absolute;right:-28px;bottom:24px;padding:13px 17px;border:1px solid var(--line);border-radius:12px;background:rgba(29,48,48,.94);color:var(--muted);font-size:14px}
.about-copy h2{font-size:clamp(40px,4vw,64px);line-height:1.05;margin:0 0 26px;letter-spacing:-.04em}
.about-copy>p{max-width:760px;color:var(--muted);font-size:18px;line-height:1.75}
.about-values{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:34px}
.about-value{padding:20px 18px;border-top:2px solid var(--emerald);background:rgba(36,57,57,.55)}
.about-value strong{display:block;margin-bottom:8px;font-size:16px}.about-value span{color:var(--muted);font-size:14px;line-height:1.5}
.proof{border:1px solid var(--line);border-radius:20px;background:rgba(23,38,39,.64);overflow:hidden;margin-bottom:36px}
.fact-icon{border:0;border-radius:12px;background:var(--surface-3);color:var(--mint)}
.section{padding-block:112px}.section-heading{margin-bottom:56px}
.expertise-grid{grid-template-columns:repeat(12,1fr);gap:14px;border:0}
.expertise-card{grid-column:span 6;min-height:220px;padding:34px;border:1px solid var(--line);border-radius:18px;background:rgba(29,48,48,.62)}
.expertise-card:nth-child(1),.expertise-card:nth-child(4){grid-column:span 7}.expertise-card:nth-child(2),.expertise-card:nth-child(3){grid-column:span 5}
.expertise-card>span{display:grid;width:48px;height:48px;place-items:center;border-radius:14px;background:var(--surface-3);font-size:19px;letter-spacing:0}
.expertise-card h3{margin:25px 0 12px}.expertise-card p{font-size:16px}
.experience-list{position:relative;gap:0;padding-left:40px}
.experience-list::before{content:"";position:absolute;left:10px;top:22px;bottom:22px;width:1px;background:linear-gradient(var(--mint),var(--line))}
.experience-card{position:relative;display:grid;grid-template-columns:280px 1fr;border:0;border-bottom:1px solid var(--line);background:transparent!important}
.experience-card::before{content:"";position:absolute;left:-36px;top:54px;width:13px;height:13px;border:3px solid var(--bg);border-radius:50%;background:var(--emerald);box-shadow:0 0 0 1px var(--emerald)}
.role-meta,.role-details{padding:45px 34px}.role-meta{border:0}.role-meta strong{font-size:22px;margin-top:20px}
.role-intro{font-size:20px}.role-details ul{grid-template-columns:repeat(2,1fr);gap:12px 28px}
.role-details li{padding-left:0}.role-details li::before{display:none}
.role-details li{border-left:2px solid rgba(139,210,188,.35);padding-left:15px}
.projects-grid{grid-template-columns:1.15fr .85fr;grid-auto-rows:minmax(180px,auto);gap:16px}
.project-card{min-height:0;padding:38px;border-radius:22px;background:var(--surface);overflow:hidden}
.project-card:first-child{grid-row:span 2;background:linear-gradient(155deg,rgba(47,128,109,.22),transparent 55%),var(--surface-2)}
.project-card:nth-child(n+2){padding:30px}.project-card h3{margin-top:46px}
.project-card:first-child h3{font-size:36px;margin-top:90px}
.tags span{border-radius:999px;background:rgba(36,57,57,.68);color:#cad8d4}
.services-grid{grid-template-columns:1fr 1fr;border:0;gap:0 54px}
.services-grid article{position:relative;min-height:0;padding:30px 0 30px 62px;border:0;border-bottom:1px solid var(--line)}
.services-grid article>span{position:absolute;left:0;top:31px;display:grid;width:42px;height:42px;place-items:center;border-radius:50%;background:var(--surface-3)}
.services-grid h3{margin:0 0 10px}.deliverables{border-radius:16px;background:rgba(47,128,109,.12)}
.contact{border-radius:26px;background:linear-gradient(135deg,var(--surface-2),#213837);border-color:var(--line)}
.reveal{opacity:0;transform:translateY(24px);transition:opacity .7s ease,transform .7s ease}
.reveal.visible{opacity:1;transform:none}
.expertise-card,.project-card,.about-value{transition:transform .25s ease,border-color .25s ease,background .25s ease}
.expertise-card:hover,.about-value:hover{transform:translateY(-4px);border-color:rgba(139,210,188,.4)}
@media(max-width:1050px){
  .site-header{grid-template-columns:auto 1fr}.site-header nav{display:flex;order:3;grid-column:1/-1;overflow-x:auto;justify-content:flex-start;padding:8px 0 12px}
  .site-header{height:auto;min-height:74px;flex-wrap:wrap}.languages{justify-self:end}
  .about{grid-template-columns:300px 1fr;gap:48px}.about-values{grid-template-columns:1fr}

const languageOrder = ["EN", "DE", "RU", "PL", "PT"];
const escapeHtml = (value) => String(value)
  .replaceAll("&", "&amp;")
  .replaceAll("<", "&lt;")
  .replaceAll(">", "&gt;")
  .replaceAll('"', "&quot;")
  .replaceAll("'", "&#039;");

function render(language) {
  const t = translations[language];
  const app = document.querySelector("#app");
  document.documentElement.lang = languageOptions[language].locale;
  localStorage.setItem("portfolio-language", language);

  const expertise = t.expertise.map(([number, title, description], index) =>
    `<article class="expertise-card reveal"><span>${["⌁","↗","◇","◎"][index] || "✓"}</span><h3>${escapeHtml(title)}</h3><p>${escapeHtml(description)}</p></article>`
  ).join("");

  const experiences = t.experiences.map((item) => {
    const points = item.points.length
      ? `<ul>${item.points.map((point) => `<li>${escapeHtml(point)}</li>`).join("")}</ul>`
      : "";
    return `<article class="experience-card reveal">
      <div class="role-meta"><span>${escapeHtml(item.period)}</span><strong>${escapeHtml(item.role)}</strong><p>${escapeHtml(item.company)}</p><small>${escapeHtml(item.location)}</small></div>
      <div class="role-details"><p class="role-intro">${escapeHtml(item.intro)}</p>${points}</div>
    </article>`;
  }).join("");

  const projects = t.projects.map(([title, description, tags], index) =>
    `<article class="project-card reveal"><div class="project-number">0${index + 1}</div><h3>${escapeHtml(title)}</h3><p>${escapeHtml(description)}</p><div class="tags">${tags.map((tag) => `<span>${escapeHtml(tag)}</span>`).join("")}</div></article>`
  ).join("");

  const services = t.services.map(([title, description], index) =>
    `<article><span>0${index + 1}</span><h3>${escapeHtml(title)}</h3><p>${escapeHtml(description)}</p></article>`
  ).join("");

  const about = aboutCopy[language];
  app.innerHTML = `
    <a class="skip-link" href="#main-content">Skip to content</a>
    <header class="site-header">
      <a class="identity" href="#top" aria-label="André Nemetz home"><span class="monogram">AN</span><span class="identity-name">André Nemetz</span></a>
      <nav aria-label="Primary navigation">
        <a href="#about">${escapeHtml(about.nav)}</a><a href="#expertise">${escapeHtml(t.nav[0])}</a>
        <a href="#experience">${escapeHtml(t.nav[1])}</a><a href="#projects">${escapeHtml(t.nav[2])}</a>
        <a href="#freelance">${escapeHtml(t.nav[3])}</a>
      </nav>
      <div class="languages" aria-label="Language">
        ${languageOrder.map((item) => `<button class="${language === item ? "active" : ""}" data-language="${item}" aria-label="${escapeHtml(languageOptions[item].label)}" aria-pressed="${language === item}" title="${escapeHtml(languageOptions[item].label)}"><img src="${languageOptions[item].flagSrc}" alt="" width="28" height="21"></button>`).join("")}
      </div>
    </header>

    <section class="hero shell" id="top" aria-labelledby="hero-title">
      <div class="hero-copy">
        <p class="eyebrow">${escapeHtml(t.eyebrow)}</p>
        <h1 id="hero-title">${escapeHtml(t.title[0])}<em>${escapeHtml(t.title[1])}</em></h1>
        <p class="intro">${escapeHtml(t.intro)}</p>
        <div class="actions">
          <a class="button primary" href="#projects">${escapeHtml(t.work)}<span>↗</span></a>
          <a class="button secondary" href="#freelance">${escapeHtml(t.hire)}<span>→</span></a>
        </div>
      </div>
      <div class="quality-orbit" aria-hidden="true">
        <span class="orbit orbit-one"></span><span class="orbit orbit-two"></span><span class="orbit orbit-three"></span>
        <span class="core">QA</span>
        <span class="node node-one">API</span><span class="node node-two">E2E</span>
        <span class="node node-three">AI</span><span class="node node-four">DB</span>
        <span class="node node-five">SKILLS</span><span class="node node-six">SDD</span><span class="node node-seven">BDD</span>
        <span class="route route-one"></span><span class="route route-two"></span>
      </div>
    </section>

    <main id="main-content">

  document.querySelectorAll("[data-language]").forEach((button) => {
    button.addEventListener("click", () => render(button.dataset.language));
  });

  const revealObserver = new IntersectionObserver((entries) => {
    entries.forEach((entry) => {
      if (entry.isIntersecting) {
        entry.target.classList.add("visible");
        revealObserver.unobserve(entry.target);
      }
    });
  }, { threshold: 0.12 });
  document.querySelectorAll(".reveal").forEach((element) => revealObserver.observe(element));

  const sections = [...document.querySelectorAll("section[id]")];
  const navLinks = [...document.querySelectorAll("nav a")];
  const sectionObserver = new IntersectionObserver((entries) => {
    entries.forEach((entry) => {
      if (!entry.isIntersecting) return;
      navLinks.forEach((link) => {
        const active = link.getAttribute("href") === `#${entry.target.id}`;
        link.classList.toggle("active", active);
        if (active) link.setAttribute("aria-current", "location");
        else link.removeAttribute("aria-current");
      });
    });
  }, { rootMargin: "-35% 0px -55% 0px" });
  sections.forEach((section) => sectionObserver.observe(section));
}

const savedLanguage = localStorage.getItem("portfolio-language");
render(languageOrder.includes(savedLanguage) ? savedLanguage : "EN");
